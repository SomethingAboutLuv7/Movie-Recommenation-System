<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Movies</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            margin: 0;
        }
        .nav-wrapper { background-color: #1a1a2e; border-bottom: 3px solid #e50914; }
        .brand-logo { margin-left: 20px; margin-top: -1%; color: #fff !important; }
        .container { margin-top: 20px; }
        .card {
            margin: 10px;
            width: 100%;
            background-color: #1e1e2f;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .card:hover { transform: scale(1.03); }
        .card-title { font-size: 1.2rem; color: #fff; }
        .input-field { margin-bottom: 20px; }
        .card-content { text-align: center; background-color: #1e1e2f; }
        #web { margin-left: 85%; font-size: 20px; font-weight: bold; padding: 5px 20px; border-radius: 9px; background-color: rgb(235, 100, 100); }
        .JT { margin-top: -10%; font-size: 23px; color: #f5f5f5; font-weight: 400; }
        #oooo { background-color: #e50914; margin-left: 1600px; }
        .ex23 { font-size: 17px; }
        .gfg1 { color: #ffffff; font-size: 25px; font-weight: bold; }
        .gfgd { color: #b3b3b3; }
        .btn { padding: 0px 10px; font-weight: bold; background-color: #e50914; }
        .card img { width: 100%; height: 300px; object-fit: cover; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-wrapper">
            <a href="/" class="brand-logo"><h4><b>Movie Recommendation System </b></h4></a>
            <button class="btn btn-danger" id="oooo"> <a  href="{% url 'logout' %}">Logout </a></button>
        </div>
    </nav>
    <br>
    <br>

    <div class="container">
        <div class="row">
            <div class="col m5">
                <div class="input-field col s12">
                    <select multiple onchange="getMovies()" id="emenities">
                        <option value="" disabled selected>Choose Your Preference</option>
                        {% for emenitie in emenities %}
                            <option value="{{emenitie.id}}">{{emenitie.name}}</option>
                        {% endfor %}
                    </select>
                    <label for="emenities"><h3 class="JT"> <i class="fas fa-suitcase"></i> Select Movie   :</h3></label>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row" id="show_movies_here">
        </div>
    </div>

    <script>
        var show_movies_here = document.getElementById("show_movies_here");

        $(document).ready(function(){
            $('select').formSelect();
        });

        function getMovies() {
            var instance = M.FormSelect.getInstance(document.getElementById('emenities'));
            var emenities = '';
            var html = '';

            if(instance){
                emenities = instance.getSelectedValues();
            }

            fetch(`/api/movies?emenities=${emenities}`)
            .then(result => result.json())
            .then(response => {
                for (var i = 0; i < response.length; i++) {
                    html += `
                        <div class="col s12 m4">
                            <div class="card">
                                <img src="${response[i].movie_image}" alt="${response[i].movie_name}">
                                <div class="card-content">
                                    <span class="gfg1">${response[i].movie_name}</span>
                                    <p class="gfgd">${response[i].movie_description}</p>
                                    <br>
                                    <button type="submit" class="btn">Book</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
                show_movies_here.innerHTML = html;
            });
        }
       getMovies()
    </script>
</body>
</html>
