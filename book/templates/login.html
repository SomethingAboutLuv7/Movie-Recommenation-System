{% extends "base.html" %}

{% block start %}
<div class="container mt-5 mx-auto col-md-4 card shadow p-5" style="background-color: #1e1e2f; border-radius: 20px; border: 1px solid #2a2a3d;">
    <div class="login-form">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success {{ message.tags }} mt-4" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <form action="" method="post">
            {% csrf_token %}
            <h2 class="text-center" style="color: #fff;">Log In</h2>
            <div class="form-group">
                <input type="text" class="form-control" name="username" placeholder="Username" required style="background-color: #2a2a3d; border: 1px solid #3a3a52; border-radius: 5px; padding: 10px; color: #fff;">
            </div>
            <div class="form-group mt-4">
                <input type="password" class="form-control" name="password" placeholder="Password" required style="background-color: #2a2a3d; border: 1px solid #3a3a52; border-radius: 5px; padding: 10px; color: #fff;">
            </div>
            <div class="form-group mt-4">
                <button class="btn btn-success btn-block" style="background-color: #e50914; border: none;">Log In</button>
            </div>
        </form>
        <p class="text-center" style="color: #b3b3b3;">Don't have an account? <a href="{% url 'register' %}" style="color: #e50914;">Create an Account</a></p>
    </div>
</div>
{% endblock %}
