<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookings</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; color: #f5f5f5; }
        .nav-wrapper { background-color: #1a1a2e; border-bottom: 3px solid #e50914; }
        table { background-color: #1e1e2f; }
        th { color: #e50914; }
        td, th { color: #f5f5f5 !important; }
    </style>
</head>
<body>
    <nav><div class="nav-wrapper">
        <a href="/" class="brand-logo" style="margin-left:20px;color:#fff;">My Bookings</a>
    </div></nav>
    <div class="container" style="margin-top:30px;">
        <a href="/" class="btn" style="background-color:#e50914;">Back to Movies</a>
        <table class="striped" style="margin-top:20px;">
            <thead><tr><th>Movie</th><th>Showtime</th><th>Seats</th><th>Total</th><th>Booked At</th></tr></thead>
            <tbody>
                {% for b in bookings %}
                <tr>
                    <td>{{ b.showtime.movie.movie_name }}</td>
                    <td>{{ b.showtime.date_time }}</td>
                    <td>{{ b.seat_numbers }}</td>
                    <td>${{ b.total_price }}</td>
                    <td>{{ b.booked_at }}</td>
                </tr>
                {% empty %}
                <tr><td colspan="5">No bookings yet.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
